      <stop offset="0%" stop-color="#0d2638"/>
      <stop offset="55%" stop-color="#07131f"/>
      <stop offset="100%" stop-color="#050c14"/>
    </radialGradient>
    <linearGradient id="hexCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38f3ff"/>
