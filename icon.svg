<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142338"/>
      <stop offset="85%" stop-color="#07090d"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e08a"/>
    </linearGradient>
    <radialGradient id="symbolGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00e08a"/>
      <stop offset="70%" stop-color="#00c878"/>
      <stop offset="100%" stop-color="#008f55"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark tactical background with safe-area padding for maskable icons -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>
  
  <!-- Outer tactical radar ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#243044" stroke-width="4" stroke-dasharray="14 10" opacity="0.8"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.35"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#243044" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="476" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="76" y2="256" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="476" y2="256" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Tactical Hex Shield / Defense Perimeter -->
  <polygon points="256,66 396,146 396,306 256,386 116,306 116,146" 
           fill="#0d1724" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#neon)"/>

  <!-- Biohazard / Command Center Core Emblem -->
  <!-- Center circle -->
  <circle cx="256" cy="236" r="32" fill="url(#symbolGlow)" stroke="#07090d" stroke-width="10"/>

  <!-- Three Biohazard Leaves / Arcs -->
  <!-- Top Leaf -->
  <path d="M 256,120 A 68,68 0 0,0 200,202 A 78,78 0 0,1 312,202 A 68,68 0 0,0 256,120 Z" 
        fill="url(#symbolGlow)" stroke="#07090d" stroke-width="6"/>
  <!-- Bottom Right Leaf -->
  <path d="M 354,292 A 68,68 0 0,0 354,204 A 78,78 0 0,1 298,300 A 68,68 0 0,0 354,292 Z" 
        fill="url(#symbolGlow)" stroke="#07090d" stroke-width="6"/>
  <!-- Bottom Left Leaf -->
  <path d="M 158,292 A 68,68 0 0,0 214,300 A 78,78 0 0,1 158,204 A 68,68 0 0,0 158,292 Z" 
        fill="url(#symbolGlow)" stroke="#07090d" stroke-width="6"/>

  <!-- Central inner hazard cutout ring -->
  <circle cx="256" cy="236" r="62" fill="none" stroke="url(#symbolGlow)" stroke-width="8" stroke-dasharray="82 46"/>

  <!-- Base text badge: COMMAND -->
  <rect x="176" y="326" width="160" height="34" rx="6" fill="#07090d" stroke="#00e5ff" stroke-width="3"/>
  <text x="256" y="349" font-family="'Segoe UI', Trebuchet, Consolas, sans-serif" font-size="16" font-weight="900" 
        fill="#00e5ff" letter-spacing="4" text-anchor="middle">Z.D.C.</text>
</svg>
